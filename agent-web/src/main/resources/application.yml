spring:
  application:
    name: dpom-agent
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DPOM_DB_URL:jdbc:mysql://localhost:3306/dpom_agent?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DPOM_DB_USER:dpom}
    password: ${DPOM_DB_PASSWORD:dpom}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: ${DPOM_FLYWAY_BASELINE_VERSION:9}
  data:
    redis:
      host: ${DPOM_REDIS_HOST:localhost}
      port: ${DPOM_REDIS_PORT:6379}
      password: ${DPOM_REDIS_PASSWORD:}

server:
  port: 8080
  shutdown: graceful

management:
  health:
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,executorCapacity
      status:
        http-mapping:
          DOWN: 503
          OUT_OF_SERVICE: 503

mybatis:
  mapper-locations: classpath*:com/dpom/agent/core/persistence/mapper/*.xml

logging:
  level:
    com.dpom.agent: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-}] %logger{39} - %msg%n"

# 外部能力接入配置（默认值见各适配器的 @Value 注解）
dpom:
  flyway:
    mysql-baseline:
      enabled: ${DPOM_FLYWAY_MYSQL_BASELINE_ENABLED:true}
      location: ${DPOM_FLYWAY_MYSQL_BASELINE_LOCATION:classpath:db/baseline/mysql8_baseline.sql}
  api:
    # 调查提交请求体总量上限（1.1 MiB），超限在反序列化前拒绝为 413
    max-body-bytes: ${DPOM_API_MAX_BODY_BYTES:1153434}
    # 被动适配器健康状态过期窗口
    adapter-health-ttl: ${DPOM_ADAPTER_HEALTH_TTL:5m}
  executor:
    # 优雅停机时有界等待在途任务的秒数（禁止无限等待）
    await-termination-seconds: ${DPOM_EXECUTOR_AWAIT_TERMINATION_SECONDS:30}
  llm:
    base-url: ${DPOM_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DPOM_LLM_MODEL:deepseek-v4-pro}
  codegraph:
    # CodeGraph 官方 stdio MCP：仅 development profile 装配（production 缺省 false，不启动子进程/不访问源码）
    enabled: ${DPOM_CODEGRAPH_ENABLED:false}
    # 服务端配置的 CodeGraph 可执行文件路径（正式部署为离线安装包，构建/启动不下载）
    executable-path: ${DPOM_CODEGRAPH_EXECUTABLE_PATH:}
    # 固定并经校验的 CodeGraph 版本
    version: ${DPOM_CODEGRAPH_VERSION:1.5.0}
    # CODEGRAPH_MCP_TOOLS：默认 explore + 显式启用确定性 DTO 工具
    mcp-tools: ${DPOM_CODEGRAPH_MCP_TOOLS:explore,status,node,search,callers,callees,impact,files}
  repositories:
    # Repository Registry：serviceCode → release/commit/path；base-path 用于 real-path containment
    base-path: ${DPOM_REPOSITORIES_BASE_PATH:}
    services: {}
  runtime:
    base-url: ${DPOM_RUNTIME_URL:http://localhost:8082}
  logtemplate:
    mcp-base-url: ${DPOM_LOGTEMPLATE_MCP_URL:http://localhost:8100}
  handoff:
    # production / development 装配边界；production 提供升级判定+打包+审批上传，development 提供校验+恢复
    mode: ${DPOM_HANDOFF_MODE:development}
    confidence-threshold: ${DPOM_HANDOFF_CONFIDENCE_THRESHOLD:60}
    max-package-bytes: ${DPOM_HANDOFF_MAX_PACKAGE_BYTES:1048576}
    max-package-entries: ${DPOM_HANDOFF_MAX_PACKAGE_ENTRIES:200}
    schema-version: ${DPOM_HANDOFF_SCHEMA_VERSION:1}
    approval-ttl-seconds: ${DPOM_HANDOFF_APPROVAL_TTL_SECONDS:3600}
    obs:
      # 默认关闭；真实 OBS SDK 集成留待后续独立 Change，测试/本地用 in-memory fake
      enabled: ${DPOM_HANDOFF_OBS_ENABLED:false}
      bucket: ${DPOM_HANDOFF_OBS_BUCKET:}
      prefix: ${DPOM_HANDOFF_OBS_PREFIX:}
      region: ${DPOM_HANDOFF_OBS_REGION:}

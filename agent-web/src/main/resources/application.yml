spring:
  application:
    name: dpom-agent
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DPOM_DB_URL:jdbc:mysql://localhost:3306/dpom_agent?useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DPOM_DB_USER:dpom}
    password: ${DPOM_DB_PASSWORD:dpom}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${DPOM_REDIS_HOST:localhost}
      port: ${DPOM_REDIS_PORT:6379}
      password: ${DPOM_REDIS_PASSWORD:}

server:
  port: 8080

logging:
  level:
    com.dpom.agent: INFO
# 外部能力接入配置（默认值见各适配器的 @Value 注解）
dpom:
  llm:
    base-url: ${DPOM_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DPOM_LLM_MODEL:deepseek-v4-pro}
  codegraph:
    mcp-base-url: ${DPOM_CODEGRAPH_MCP_URL:http://localhost:8080}
  runtime:
    base-url: ${DPOM_RUNTIME_URL:http://localhost:8082}
  logtemplate:
    mcp-base-url: ${DPOM_LOGTEMPLATE_MCP_URL:http://localhost:8100}
